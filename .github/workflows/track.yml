name: Track players

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tanki-player-tracking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect player snapshots
        run: python scripts/track.py

      - name: Save changed tracker data
        run: |
          if git diff --quiet -- data/tracker.json; then
            echo "No tracker change to commit."
            exit 0
          fi
          git config user.name "tanki-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json
          git commit -m "data: collect player snapshots"
          git push
