name: Update player username

on:
  workflow_dispatch:
    inputs:
      tracked_player:
        description: Current or previous tracked username
        required: true
        type: string
      new_username:
        description: New Tanki username
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tanki-player-tracking
  cancel-in-progress: false

jobs:
  update:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify and migrate username
        env:
          TRACKED_PLAYER: ${{ inputs.tracked_player }}
          NEW_USERNAME: ${{ inputs.new_username }}
        run: python scripts/update_player_name.py

      - name: Save username migration
        run: |
          if git diff --quiet -- data/players.json data/tracker.json; then
            echo "No username change to commit."
            exit 0
          fi
          git config user.name "tanki-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json data/tracker.json
          git commit -m "data: update player username"
          git push
