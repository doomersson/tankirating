<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanki Tracker responsive checks</title>
    <style>
      body { margin: 0; padding: 16px; background: #e8ebed; color: #111; font: 14px system-ui, sans-serif; }
      main { display: grid; gap: 24px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; font-weight: 700; }
      iframe { display: block; height: 900px; max-width: 100%; border: 2px solid #111; background: #101317; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>320 px</figcaption><iframe title="320 pixel tracker" src="../index.html" width="320"></iframe></figure>
      <figure><figcaption>375 px</figcaption><iframe title="375 pixel tracker" src="../index.html" width="375"></iframe></figure>
      <figure><figcaption>414 px</figcaption><iframe title="414 pixel tracker" src="../index.html" width="414"></iframe></figure>
      <figure><figcaption>768 px</figcaption><iframe title="768 pixel tracker" src="../index.html" width="768"></iframe></figure>
    </main>
  </body>
</html>
